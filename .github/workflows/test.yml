name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      # A real Neo4j so the Neo4j and Cypher tests run in CI too
      neo4j:
        image: neo4j:5.26
        env:
          NEO4J_AUTH: neo4j/ci-password-123
          NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-password-123 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 40s
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: make install
      - name: Run tests with coverage (fails below 60%)
        run: make test
