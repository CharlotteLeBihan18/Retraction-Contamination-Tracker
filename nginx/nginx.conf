# Reverse proxy: the only public entry point to the API.
# The FastAPI container is not published on the host, so every request goes through here.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

upstream api_upstream {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Do not advertise the nginx version
    server_tokens off;

    # Basic security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 1m;

    location / {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM calls on /api/ask can take a while
        proxy_read_timeout 120s;
    }
}
